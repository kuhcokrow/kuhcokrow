name: Metrics
 
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
 
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
 
          # ===== Template & tampilan =====
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
 
          # ===== Isometric commit calendar (kayak "kota 3D" dari contribution graph) =====
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
 
          # ===== Achievements (badge level, kayak XP/rank developer) =====
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
 
          # ===== Breakdown bahasa pemrograman paling sering dipakai =====
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_threshold: 0%
 
          # ===== Kebiasaan ngoding: jam aktif, hari paling produktif, dll =====
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_trim: compact
 
          # ===== Statistik "notable" kontribusi di repo/organisasi besar =====
          plugin_notable: yes
          plugin_notable_indepth: yes
 
          # ===== Lines of code yang pernah diubah =====
          plugin_lines: yes
          plugin_lines_history_limit: 28
          plugin_lines_repositories_limit: 5